# Adapted from https://github.com/JamesIves/github-pages-deploy-action
name: Build and Deploy Scroll
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v2.3.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and Build
        run: |
          npm install --omit=dev
          npm run build
      - name: Prepare deployment
        run: |
          mkdir -p "$RUNNER_TEMP/wws-site"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='.gitignore' ./ "$RUNNER_TEMP/wws-site/"
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: wws # The branch the action should deploy to.
          folder: ${{ runner.temp }}/wws-site
